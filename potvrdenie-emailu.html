<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Potvrdenie dopytu | DopytAI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f9fd;
      color: #10294d;
    }
    header {
      background: white;
      border-bottom: 1px solid #dce7f3;
      padding: 25px;
      text-align: center;
    }
    .logo {
      font-size: 29px;
      font-weight: 900;
      color: #10294d;
    }
    .logo span { color: #087cf0; }
    main {
      max-width: 520px;
      margin: 65px auto;
      padding: 30px 24px;
      text-align: center;
      background: white;
      border: 1px solid #dce7f3;
      border-radius: 18px;
    }
    h1 { font-size: 25px; }
    p { line-height: 1.6; color: #526780; }
    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #087cf0;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }
    .message {
      padding: 16px;
      margin: 20px 0;
      border-radius: 10px;
      background: #edf6ff;
      line-height: 1.6;
    }
    a { color: #087cf0; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Dopyt<span>AI</span></div>
  </header>

  <main>
    <h1>Potvrdenie vášho dopytu</h1>
    <p>
      Ďakujeme, že ste využili DopytAI.
      Potvrdením e-mailu aktivujete svoj dopyt.
    </p>

    <div id="message" class="message" role="status" aria-live="polite">
      Kliknite na tlačidlo a potvrďte svoj dopyt.
    </div>

    <button id="confirmBtn" type="button">
      Potvrdiť e-mail a aktivovať dopyt
    </button>

    <p>
      <a href="/">Späť na DopytAI</a>
    </p>
  </main>

  <script>
    const message = document.getElementById("message");
    const button = document.getElementById("confirmBtn");

    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get("id"));
    const token = params.get("token");

    // Odstránenie tokenu z adresného riadka po jeho načítaní.
    history.replaceState(null, "", window.location.pathname);

    if (
      !Number.isSafeInteger(id) ||
      id <= 0 ||
      !token ||
      !/^[0-9a-f]{64}$/.test(token)
    ) {
      message.textContent =
        "Overovací odkaz je neplatný alebo neúplný.";
      button.disabled = true;
    }

    button.addEventListener("click", async () => {
      button.disabled = true;
      message.textContent = "Overujeme váš dopyt...";

      try {
        const response = await fetch(
          "/.netlify/functions/confirm-demand-email",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              dopyt_id: id,
              token: token
            })
          }
        );

        if (!response.ok) {
          throw new Error("Potvrdenie sa nepodarilo.");
        }

        const result = await response.json();

        if (result.success === true) {
          message.textContent =
            "✅ E-mail bol potvrdený. Váš dopyt je aktivovaný a pripravený pre remeselníkov.";
          button.style.display = "none";
        } else {
          message.textContent =
            "Odkaz je neplatný, už použitý alebo vypršal.";
        }
      } catch (error) {
        message.textContent =
          "Potvrdenie sa momentálne nepodarilo. Skúste to znova.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
